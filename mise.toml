min_version = "2026.9.4"

[tools]
hk = "latest"
pandoc = "latest"
rust = "latest"

[tasks.hooks]
description = "Install or refresh hk Git hooks"
run = "hk install"

[tasks.check]
description = "Run hk check across modified or staged files"
run = "hk check"

[tasks."check:plan"]
description = "Preview hk check execution plan without running tools"
run = "hk check --plan"

[tasks."check:changed"]
description = "Run hk check only on modified/staged/untracked files"
run = "hk check"

[tasks.fix]
description = "Run all hk fixers to format files"
run = "hk fix"

[tasks.lint]
description = "Run full static analysis and syntax checks across the repository"
run = "hk check --all"

[tasks.format]
description = "Format all files across the repository"
run = "hk fix --all"

[tasks.build]
description = "Build ftty binary in debug mode"
run = "cargo build"

[tasks."build:release"]
description = "Build optimized ftty binary in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run test suite"
run = "cargo test"

[tasks.doc]
description = "Compile manual page from Markdown source via pandoc with dynamic date and version"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
date=$(LC_ALL=C git log -1 --format=%cd --date=format:'%B %Y' doc/ftty.1.md 2>/dev/null || LC_ALL=C date +"%B %Y")
pandoc -s -t man doc/ftty.1.md -M date="${date}" -M footer="ftty ${version}" -o doc/ftty.1
'''
