min_version = "2026.9.4"

[tools]
hk = "latest"
rust = "latest"

[tasks.hooks]
description = "Install or refresh hk Git hooks"
run = "hk install"

[tasks.check]
description = "Run hk check across modified or staged files"
run = "hk check"

[tasks."check:plan"]
description = "Preview hk check execution plan without running tools"
run = "hk check --plan"

[tasks."check:changed"]
description = "Run hk check only on modified/staged/untracked files"
run = "hk check"

[tasks.fix]
description = "Run all hk fixers to format files"
run = "hk fix"

[tasks.lint]
description = "Run full static analysis and syntax checks across the repository"
run = "hk check --all"

[tasks.format]
description = "Format all files across the repository"
run = "hk fix --all"

[tasks.build]
description = "Build ftty binary in debug mode"
run = "cargo build"

[tasks."build:release"]
description = "Build optimized ftty binary in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run test suite"
run = "cargo test"
