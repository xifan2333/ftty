name: ci

on:
  push:
    branches:
      - main
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: empty-commit-guard
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD plus its parent suffice to detect a placeholder empty commit.
          fetch-depth: 2

      - name: Detect empty-commit head
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify -q HEAD^ >/dev/null && git diff --quiet HEAD^ HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check-and-test
    needs: guard
    if: needs.guard.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git merge-base HEAD origin/main` works for the changed-file ratchets.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgles2-mesa-dev fonts-dejavu-core

      - name: Install quality gate tools via mise
        uses: jdx/mise-action@v5
        with:
          # Only the ratchet tools; the Rust toolchain (with rustfmt/clippy) is provisioned
          # by dtolnay/rust-toolchain below, so mise does not reinstall it.
          install_args: "github:ast-grep/ast-grep github:kucherenko/jscpd github:crate-ci/typos pipx:lizard"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Enforce AST ratchet on changed files
        run: mise run check:ast:changed

      - name: Enforce complexity ratchet (CCN/CogC <= 15)
        run: mise run check:complexity

      - name: Check code duplication (jscpd <= 3.0%)
        run: mise run check:dup

      - name: Check typos
        run: mise run check:typos

      - name: Build debug binary
        run: cargo build --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Strip release binary
        run: strip target/release/ftty

      - name: Run tests
        run: cargo test --verbose

      - name: Package release artifact
        run: tar -czf ftty-linux-x86_64.tar.gz -C target/release ftty

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftty-linux-x86_64
          path: ftty-linux-x86_64.tar.gz
          if-no-files-found: error
