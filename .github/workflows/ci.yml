name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgles2-mesa-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Strip release binary
        run: strip target/release/ftty

      - name: Run tests
        run: cargo test --verbose

      - name: Package release artifact
        run: tar -czf ftty-linux-x86_64.tar.gz -C target/release ftty

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftty-linux-x86_64
          path: ftty-linux-x86_64.tar.gz
          if-no-files-found: error
