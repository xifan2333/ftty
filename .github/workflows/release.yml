name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. 0.1.0)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${cargo_version}"
          fi

          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "Target version (${version}) does not match Cargo.toml version (${cargo_version})" >&2
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build-binary:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgles2-mesa-dev fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive
        shell: bash
        run: |
          version="${{ needs.meta.outputs.version }}"
          archive_dir="ftty-${version}-x86_64-unknown-linux-gnu"
          archive_name="${archive_dir}.tar.gz"

          mkdir -p "dist/${archive_dir}"
          cp target/release/ftty "dist/${archive_dir}/"
          cp README.md LICENSE "dist/${archive_dir}/"

          cd dist
          tar -czvf "${archive_name}" "${archive_dir}"
          sha256sum "${archive_name}" > "${archive_name}.sha256"
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist/ftty-*.tar.gz*

  publish-github-release:
    needs: [meta, build-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: dist

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ftty ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-channels:
    needs: [meta, publish-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch channels workflow for Arch AUR
        env:
          GH_TOKEN: ${{ secrets.AUR_AUTO_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run channels.yml \
            --field ref="${{ needs.meta.outputs.tag }}" \
            --field version="${{ needs.meta.outputs.version }}" || echo "Channels dispatch skipped"
