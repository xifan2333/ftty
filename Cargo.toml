[package]
name = "ftty"
version = "0.1.0"
edition = "2024"
authors = ["xifan2333 <xifan233@163.com>"]
description = "Ultra-lightweight, Suckless Wayland terminal emulator with native Kitty graphics protocol, written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/xifan2333/ftty"
homepage = "https://github.com/xifan2333/ftty"
readme = "README.md"
keywords = ["terminal", "wayland", "kitty-graphics", "suckless", "emulator"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
