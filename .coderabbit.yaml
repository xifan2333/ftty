# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "zh-CN"
tone_instructions: "Use concise, high-signal, and rigorous engineering language adhering to Suckless and Unix philosophies."
reviews:
  profile: "chill"
  auto_review:
    drafts: false
    ignore_title_keywords:
      - "chore: release"
      - "chore: initialize draft pr"
      - "chore(release)"
  tools:
    github-checks:
      enabled: true
chat:
  auto_reply: true
